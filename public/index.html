<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pyramid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#5FD7AE;--gold-100:#F6E7B8;--gold-300:#E3C878;--gold-500:#C0982F;--gold-700:#7E6115;
  --ink:#3A3222;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Golos Text",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#04170F;color:#E7F2EB;font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(80% 60% at 50% 0%,rgba(246,231,184,.10),transparent 60%),
  radial-gradient(100% 70% at 50% 100%,rgba(95,215,174,.08),transparent 60%),
  linear-gradient(180deg,#062A1C,#04170F 55%,#02100A)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-300);outline-offset:3px}

.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(3,14,9,.96);backdrop-filter:blur(10px);transition:opacity .5s}
.gate.gone{opacity:0;pointer-events:none}
.gate .card{width:min(420px,100%);text-align:center;background:none;border:none;padding:0;margin:0}
.gate h1{font-size:44px;letter-spacing:.06em}
.gate p{color:#9CBBAD;font-size:14.5px;margin:10px 0 22px}
.gate input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(224,200,120,.25);
  border-radius:2px;padding:12px 14px;margin-bottom:12px;text-align:center}
.enter{width:100%;padding:13px;border:none;border-radius:2px;font-weight:600;cursor:pointer;
  background:linear-gradient(140deg,var(--gold-300),var(--gold-500));color:#241A06}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top .spacer{margin-left:auto}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.06em}
.chip{border:1px solid rgba(255,255,255,.24);background:rgba(8,20,15,.5);color:#EAF4EE;
  padding:8px 13px;border-radius:99px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--gold-300)}
.sub{font-size:12.5px;color:#8FB5A5;margin-bottom:12px}
select.lang{background:rgba(8,20,15,.6);border:1px solid rgba(255,255,255,.24);color:#EAF4EE;
  border-radius:99px;padding:7px 10px;font-size:13.5px;cursor:pointer}

.switch{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.switch .track{width:56px;height:30px;border-radius:99px;position:relative;flex:none;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);transition:.2s}
.switch .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(160deg,#E9F6F0,#B7CFC5);transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.switch[aria-checked="true"] .track{background:linear-gradient(140deg,var(--jade),#1E8A67);border-color:transparent}
.switch[aria-checked="true"] .knob{left:28px;background:linear-gradient(160deg,#FFFDF5,#E3C878)}
.switch .labels{display:grid;line-height:1.2}
.switch .on{font-size:15px}
.switch .off{font-size:12px;color:#7FA294}
.mode-hint{font-size:12px;color:#7FA294;line-height:1.45;margin-top:10px}

.card{background:linear-gradient(180deg,rgba(9,40,28,.55),rgba(4,20,14,.75));
  border:1px solid rgba(224,200,120,.20);border-radius:6px;padding:16px;margin-bottom:14px}
.now{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.now b{font-weight:500;font-size:15px}
.now span{font-size:13px;color:#A9C4B8}
#seek{width:100%;accent-color:var(--gold-500);margin:10px 0 2px}
#seek:disabled{opacity:.4}
.time{display:flex;justify-content:space-between;font-size:12px;color:#A9C4B8}
.transport{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.tbtn{height:46px;min-width:48px;padding:0 12px;border-radius:99px;border:1px solid rgba(246,231,184,.36);
  background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center;font-size:13px}
.tbtn:hover{border-color:var(--gold-300)}
.tbtn:disabled{opacity:.3;cursor:not-allowed}
.tbtn.main{width:54px;height:54px;min-width:54px;padding:0;border:none;color:#241A06;
  background:radial-gradient(circle at 36% 30%,var(--gold-100),var(--gold-300) 42%,var(--gold-500))}
.tbtn.main:disabled{background:rgba(255,255,255,.1);color:#9CBBAD}
.tbtn svg{display:block}

.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.item{flex:none;width:112px;scroll-snap-align:center;background:none;border:none;padding:0;cursor:pointer;
  display:grid;justify-items:center;gap:8px;color:#DCEAE1}
.art{width:104px;height:104px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.2) 1px 3.5px),
    radial-gradient(circle at 30% 24%,rgba(190,255,230,.2),transparent 44%),
    radial-gradient(circle,#0E3227 56%,#05170F 100%);
  border:1px solid rgba(220,255,240,.26);box-shadow:0 14px 28px -16px rgba(0,0,0,.95)}
.art::after{content:"";position:absolute;inset:35%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--gold-100),var(--gold-300) 40%,var(--gold-500) 74%,var(--gold-700))}
.cap{font-size:12px;line-height:1.3;color:#BCD5C8;min-height:32px}
.item[aria-current="true"] .art{box-shadow:0 0 0 2px var(--jade)}
.item[aria-current="true"] .cap{color:var(--gold-100)}
body.guest .item{opacity:.5}

.notebook{background:linear-gradient(178deg,#F4EBD4,#E2D5B6);color:var(--ink);border-radius:3px;padding:12px 14px}
.notebook h3{font-size:20px;margin-bottom:4px}
#chat{min-height:84px;max-height:280px;overflow-y:auto;
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(58,50,34,.16) 27px 28px)}
.msg{font-family:var(--serif);font-size:17px;line-height:28px}
.msg b{font-weight:600}
#chatInput{width:100%;margin-top:8px;background:rgba(58,50,34,.08);border:1px solid rgba(58,50,34,.28);
  border-radius:2px;padding:8px 10px;color:var(--ink)}

.bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#mic{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#8CF0CC,var(--jade) 45%,#17795A);color:#04160F}
#mic[aria-pressed="false"]{background:rgba(255,255,255,.12);color:#CDE3D8}
.vol{display:grid;gap:2px;flex:1;min-width:120px}
.vol label{font-size:12px;color:#B7D0C4}
.vol input{width:100%;accent-color:var(--jade)}
#duck{font-size:12px;color:#241A06;background:var(--gold-300);border-radius:99px;padding:5px 10px;opacity:0;transition:.2s}
#duck.on{opacity:1}

#diag{font-size:12.5px;color:#8FB5A5;display:grid;gap:5px}
#diag div{display:flex;justify-content:space-between;gap:12px}
#diag b{color:#CFE3D8;font-weight:500;text-align:right}
.hint{font-size:12.5px;color:#7FA294;margin-top:10px;line-height:1.5}
.upload{display:inline-block;cursor:pointer;border:1px dashed rgba(246,231,184,.4);border-radius:2px;
  padding:9px 12px;font-size:13.5px;color:#EBDCB6;margin-top:10px}
#upload{display:none}

.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(2,8,6,.7);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center}
.sheet-back.on{display:flex}
.sheet{width:min(520px,100%);background:linear-gradient(180deg,#0A3225,#052016);
  border-top:1px solid rgba(246,231,184,.3);border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out both}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:23px;margin-bottom:4px}
.sheet .note{font-size:12.5px;color:#7FA294;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:4px;text-align:left;
  color:#EAF4EE;text-decoration:none;font-size:15px}
.opt:hover{border-color:var(--gold-300)}
.opt .ic{width:26px;text-align:center;color:var(--gold-300);font-size:17px}
.opt.close{justify-content:center;background:none;border-style:dashed;color:#9CBBAD}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);z-index:80;
  background:var(--gold-300);color:#241A06;padding:10px 18px;border-radius:99px;font-size:14px;
  opacity:0;transition:.24s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* холст комнаты живёт под интерфейсом */
#gl{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:0}
body.in-room #gl{display:block}
body.in-room{background:linear-gradient(180deg,#062A1C,#04170F 55%,#02100A)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;display:none;
  background:radial-gradient(125% 95% at 50% 45%,transparent 42%,rgba(1,8,5,.45) 88%,rgba(1,6,4,.8) 100%)}
body.in-room .vignette{display:block}
body.in-room .wrap{position:relative;z-index:2}
body.in-room .card{background:linear-gradient(180deg,rgba(6,26,18,.55),rgba(3,14,10,.72));backdrop-filter:blur(12px)}
body.in-room .notebook{background:linear-gradient(178deg,rgba(244,235,212,.94),rgba(226,213,182,.94))}

/* вращающаяся пирамида-логотип */
.pyr-stage{perspective:900px;display:flex;justify-content:center;align-items:flex-end}
.pyr{--s:34px;position:relative;width:var(--s);height:calc(var(--s)*.9);transform-style:preserve-3d;
  animation:pyrSpin 30s linear infinite}
.pyr .face{position:absolute;left:0;bottom:0;width:var(--s);height:calc(var(--s)*1.03);
  clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%;
  background:linear-gradient(168deg,#1B6E51,#0B3A29 38%,#17805C 62%,#062419)}
.pyr .face:nth-child(1){transform:rotateY(0deg) translateZ(calc(var(--s)/2)) rotateX(29deg)}
.pyr .face:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2)) rotateX(29deg);filter:brightness(.78)}
.pyr .face:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2)) rotateX(29deg);filter:brightness(.6)}
.pyr .face:nth-child(4){transform:rotateY(270deg) translateZ(calc(var(--s)/2)) rotateX(29deg);filter:brightness(.86)}
.pyr .face svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes pyrSpin{to{transform:rotateY(360deg)}}

/* главная страница */
.view{display:none}.view.on{display:block}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:22px 0 8px}
.hero h1{font-size:clamp(34px,7vw,52px);letter-spacing:.05em}
.hero .tag{font-family:var(--serif);font-size:clamp(19px,3.4vw,24px);color:var(--gold-300);margin-top:4px}
.hero p{color:#9CBBAD;font-size:14.5px;margin-top:12px;line-height:1.6}
.hero .pyr{--s:min(150px,32vw)}
.today-grid{display:grid;gap:14px}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.today-date{font-family:var(--serif);font-size:clamp(24px,5vw,34px)}
.today-clock{font-family:var(--serif);font-size:clamp(24px,5vw,34px);color:var(--gold-300)}
.today-meta{font-size:13.5px;color:#8FB5A5}
.vein-rule{height:1px;border:0;margin:14px 0;background:linear-gradient(90deg,transparent,var(--gold-500),transparent);opacity:.5}
.hol{display:grid;gap:8px;font-size:14.5px}
.hol div{display:flex;gap:10px;align-items:baseline}
.hol .dot{color:var(--gold-500)}
.quote{border-left:2px solid var(--gold-500);padding:4px 0 4px 16px;margin-bottom:14px}
.quote q{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3.4vw,23px);line-height:1.35;quotes:'«' '»'}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:#8FB5A5}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.perk{font-size:13.5px;color:#9CBBAD;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.perk .ic{color:var(--gold-300);flex:none}
.portals{display:grid;gap:14px}
.portal{position:relative;border:1px solid rgba(224,200,120,.22);border-radius:120px 120px 6px 6px;
  overflow:hidden;cursor:pointer;background:none;padding:0;min-height:210px;width:100%;text-align:left;color:inherit}
.portal canvas,.portal .bg{position:absolute;inset:0;width:100%;height:100%}
.portal .plate{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;
  background:linear-gradient(0deg,rgba(3,10,7,.94),rgba(3,10,7,0))}
.portal h3{font-size:23px}
.portal p{font-size:13px;color:#A9C4B8;margin-top:3px}
.portal:hover{border-color:var(--gold-300)}

/* ================= КОМНАТА: одна панель посередине ================= */
body.in-room .wrap{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
body.in-room .top{position:fixed;top:0;left:0;right:0;margin:0;padding:8px 12px;z-index:6;
  background:linear-gradient(180deg,rgba(3,12,9,.72),transparent)}
body.in-room .brand{font-size:19px}
body.in-room .card{background:none;border:none;padding:0;margin:0}

.room-bar{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:6;
  display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:99px;
  background:rgba(6,22,15,.55);border:1px solid rgba(246,231,184,.22);backdrop-filter:blur(14px);
  max-width:calc(100vw - 20px)}
.rb-room{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#BCD5C8;padding:0 6px;white-space:nowrap}
.rb-room .dot{width:7px;height:7px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade)}
.rb-room .dot.solo{background:#7d8f88;box-shadow:none}
.rb-sep{width:1px;height:18px;background:rgba(255,255,255,.16)}
.rb-hint{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:5;max-width:min(420px,92vw);
  text-align:center;font-size:11.5px;color:#7FA294;line-height:1.4;opacity:0;transition:.25s;pointer-events:none}
.rb-hint.on{opacity:1}

.ib{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#E7F2EB;font-size:12.5px}
.ib:hover{border-color:var(--gold-300)}
.ib-ic{font-size:14px;line-height:1}
.ib[aria-checked="true"],.ib[aria-pressed="true"]{border-color:var(--jade);color:#CFF6E6}
#micBtn[aria-pressed="false"]{opacity:.45}

/* пульт */
.console{width:min(360px,calc(100vw - 24px));position:relative;z-index:4;
  padding:14px 14px 12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(8,30,21,.60),rgba(3,14,10,.74));
  border:1px solid rgba(246,231,184,.22);backdrop-filter:blur(16px);
  box-shadow:0 30px 70px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,246,216,.14)}
.cs-now{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cs-now b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-now span{font-size:11.5px;color:#9CBBAD;white-space:nowrap}
#seek{width:100%;accent-color:var(--gold-500);margin:8px 0 0;height:18px}
#seek:disabled{opacity:.35}
.cs-time{display:flex;justify-content:space-between;font-size:10.5px;color:#8FB5A5}
.cs-row{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:10px}
.cs-row.two{gap:8px}
.cs-row.vols{justify-content:flex-start;margin-top:10px;gap:6px;position:relative}
.cb{height:36px;min-width:36px;padding:0 9px;border-radius:99px;cursor:pointer;font-size:11.5px;
  border:1px solid rgba(246,231,184,.3);background:rgba(255,255,255,.05);color:#EFE6CE;
  display:grid;place-items:center}
.cb:hover{border-color:var(--gold-300)}
.cb:disabled{opacity:.28;cursor:not-allowed}
.cb svg{width:15px;height:15px}
.cb.big{width:42px;height:42px;min-width:42px;border:none;color:#241A06;
  background:radial-gradient(circle at 36% 30%,var(--gold-100),var(--gold-300) 42%,var(--gold-500))}
.cb.big:disabled{background:rgba(255,255,255,.08);color:#9CBBAD}
.cb.big svg{width:16px;height:16px}

/* выпадающие меню */
.drop{position:relative;flex:1}
.drop.up{flex:none}
.db{width:100%;height:34px;display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:8px;cursor:pointer;font-size:12px;
  border:1px solid rgba(246,231,184,.26);background:rgba(255,255,255,.05);color:#EBDCB6}
.db:hover{border-color:var(--gold-300)}
.db span:first-child{color:var(--gold-300)}
.menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
  max-height:44vh;overflow:auto;padding:6px;border-radius:10px;
  background:rgba(5,20,14,.96);border:1px solid rgba(246,231,184,.28);backdrop-filter:blur(14px);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.95)}
.drop.up .menu{top:auto;bottom:calc(100% + 8px);left:-6px;right:auto;width:200px}
.drop.open .menu{display:block}
.menu .gh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-500);padding:7px 8px 3px}
.mi{display:block;width:100%;text-align:left;padding:9px 10px;border:none;border-radius:6px;cursor:pointer;
  background:none;color:#DCEAE1;font-size:12.5px;line-height:1.3}
.mi:hover{background:rgba(255,255,255,.08)}
.mi[aria-current="true"]{color:var(--gold-100);background:rgba(224,200,120,.14)}
.mi.empty{color:#7FA294;cursor:default}
.mi.empty:hover{background:none}
.mi-url{display:none;gap:6px;padding:6px}
.mi-url.on{display:flex}
.mi-url input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  border-radius:6px;padding:7px 8px;color:#E7F2EB;font-size:12px}
.mi-url button{border:none;border-radius:6px;padding:0 11px;cursor:pointer;
  background:var(--gold-300);color:#241A06}
.menu.slider{padding:10px 12px}
.menu.slider label{display:block;font-size:11px;color:#B7D0C4;margin-bottom:6px}
.menu.slider input{width:100%;accent-color:var(--jade)}

/* чат внутри пульта */
.cs-chat{margin-top:10px;border-radius:8px;padding:8px 10px;cursor:pointer;
  background:linear-gradient(178deg,rgba(244,235,212,.93),rgba(226,213,182,.93));color:var(--ink)}
#chat{max-height:56px;overflow:hidden;transition:max-height .25s;
  background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(58,50,34,.14) 25px 26px)}
.cs-chat.open #chat{max-height:150px;overflow-y:auto}
.msg{font-family:var(--serif);font-size:15px;line-height:26px}
.msg b{font-weight:600}
#chatInput{display:none;width:100%;margin-top:6px;background:rgba(58,50,34,.08);
  border:1px solid rgba(58,50,34,.26);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:13px}
.cs-chat.open #chatInput{display:block}
#duck{margin-left:auto;font-size:10.5px;color:#241A06;background:var(--gold-300);
  border-radius:99px;padding:4px 9px;opacity:0;transition:.2s;white-space:nowrap}
#duck.on{opacity:1}

/* диагностика — по кнопке i */
.diag-sheet{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;
  width:min(380px,calc(100vw - 24px));padding:14px;border-radius:12px;
  background:rgba(4,18,12,.94);border:1px solid rgba(246,231,184,.24);backdrop-filter:blur(14px)}
.diag-sheet.on{display:block}
#diag{font-size:11.5px;color:#8FB5A5;display:grid;gap:4px}
#diag div{display:flex;justify-content:space-between;gap:10px}
#diag b{color:#CFE3D8;font-weight:500;text-align:right}

@media (max-width:430px){
  .room-bar{gap:4px;padding:5px 6px}
  .ib{height:30px;padding:0 8px;font-size:11.5px}
  .ib-tx{display:none}
  .rb-room{font-size:11.5px;padding:0 4px}
}

/* ================= ГЛАВНАЯ ================= */
.hero{position:relative;min-height:min(88vh,780px);display:grid;place-items:center;
  overflow:hidden;text-align:center;padding:70px 18px 50px;
  border-bottom:1px solid rgba(246,231,184,.18)}
.hero-marble{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;
  filter:saturate(1.05);animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1.04)}to{transform:translate3d(2%,1%,0) scale(1.12)}}
.hero-veil{position:absolute;inset:0;
  background:radial-gradient(70% 55% at 50% 42%,rgba(2,14,9,.42),rgba(2,12,8,.86) 78%),
    linear-gradient(180deg,rgba(2,12,8,.6),transparent 30%,rgba(2,12,8,.92))}
.hero-inner{position:relative;z-index:2;max-width:620px}
.hero-logo{position:relative;display:grid;place-items:center;margin-bottom:18px;
  transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.hero-logo .pyr{--s:min(190px,42vw)}
.halo{position:absolute;width:140%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(246,231,184,.22),transparent 70%);
  animation:pulse 7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.1);opacity:1}}
.hero-title{font-size:clamp(44px,11vw,86px);letter-spacing:.09em;line-height:1;
  background:linear-gradient(180deg,#FFF8E2,#E3C878 55%,#A8801F);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero-tag{font-family:var(--serif);font-size:clamp(19px,4vw,26px);color:#CFE3D8;margin-top:10px}
.hero-lead{color:#9CBBAD;font-size:15px;line-height:1.65;margin:16px auto 26px;max-width:460px}
.cta{border:none;cursor:pointer;padding:14px 30px;border-radius:99px;font-weight:600;font-size:15px;
  color:#241A06;background:linear-gradient(140deg,#FFF3CF,var(--gold-300) 45%,var(--gold-500));
  box-shadow:0 14px 40px -14px rgba(224,200,120,.75);transition:transform .18s,box-shadow .18s}
.cta:hover{transform:translateY(-2px);box-shadow:0 20px 48px -14px rgba(224,200,120,.9)}
.cta.wide{width:min(360px,100%)}
.scroll-cue{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:2;
  font-size:24px;color:rgba(246,231,184,.5);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

.wrap-in{max-width:620px;margin:0 auto;padding:34px 18px 60px;display:grid;gap:34px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.reveal.seen{opacity:1;transform:none}
.reveal.center{text-align:center}
.slab{position:relative;padding:22px;border-radius:10px;overflow:hidden;
  background:linear-gradient(155deg,rgba(12,58,40,.55),rgba(4,22,15,.72));
  border:1px solid rgba(246,231,184,.2)}
.slab::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 18% 0%,rgba(246,231,184,.12),transparent 60%)}
.slab-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.slab-date{font-family:var(--serif);font-size:clamp(22px,5vw,30px)}
.slab-clock{font-family:var(--serif);font-size:clamp(22px,5vw,30px);color:var(--gold-300)}
.slab-meta{font-size:13.5px;color:#8FB5A5;margin-top:4px}
.slab-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-500)}
.vein-rule{height:1px;border:0;margin:16px 0;
  background:linear-gradient(90deg,transparent,var(--gold-500),transparent);opacity:.55}
.hol{display:grid;gap:9px;font-size:14.5px;margin-top:10px}
.hol div{display:flex;gap:10px;align-items:baseline}
.hol .dot{color:var(--gold-500);font-size:10px}
.quote{border-left:2px solid var(--gold-500);padding:4px 0 4px 18px;margin-bottom:18px}
.quote q{font-family:var(--serif);font-style:italic;font-size:clamp(19px,3.6vw,24px);line-height:1.4;quotes:'«' '»'}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:12.5px;color:#8FB5A5}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.perk{font-size:13.5px;color:#9CBBAD;line-height:1.5;padding:14px;border-radius:8px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.perk .ic{display:block;color:var(--gold-300);font-size:15px;margin-bottom:7px}
@media (max-width:520px){.perks{grid-template-columns:1fr}}

/* порталы комнат */
.portals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.portal{min-height:230px;border-radius:130px 130px 8px 8px;transition:transform .22s,border-color .22s}
.portal:hover{transform:translateY(-4px)}
@media (max-width:640px){.portals{grid-template-columns:1fr}.portal{min-height:180px;border-radius:100px 100px 8px 8px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<div class="gate" id="gate"><div class="card">
  <h1>Pyramid</h1>
  <p id="gateLead"></p>
  <input id="name" autocomplete="nickname">
  <button class="enter" id="enter"></button>
  <p id="gateMic" style="margin-top:16px"></p>
</div></div>

<div class="wrap">
  <div class="top">
    <div class="pyr-stage"><div class="pyr" id="logoSmall"><div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1.2" opacity=".9"><path d="M50 4 C44 34 58 56 46 100"/><path d="M50 4 C62 40 40 70 66 100"/><path d="M52 22 C68 44 74 72 82 100"/></g></svg></div><div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1" opacity=".8"><path d="M50 6 C40 44 62 64 40 100"/></g></svg></div><div class="face"></div><div class="face"></div></div></div>
    <span class="brand">Pyramid</span>
    <span class="spacer"></span>
    <select class="lang" id="lang" aria-label="Language"></select>
    <button class="chip" id="toRooms" style="display:none"></button>
    <button class="chip" id="transfer" style="display:none"></button>
    <button class="chip" id="invite" style="display:none"></button>
  </div>

  <!-- ГЛАВНАЯ -->
  <div class="view on" id="viewHome">
    <section class="hero">
      <canvas class="hero-marble" id="heroMarble"></canvas>
      <div class="hero-veil"></div>
      <div class="hero-inner">
        <div class="hero-logo" id="heroLogo">
          <div class="pyr-stage"><div class="pyr" id="logoBig">
            <div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1.2" opacity=".92"><path d="M50 4 C44 34 58 56 46 100"/><path d="M50 4 C62 40 40 70 66 100"/><path d="M52 22 C68 44 74 72 82 100"/></g></svg></div>
            <div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1" opacity=".8"><path d="M50 6 C40 44 62 64 40 100"/></g></svg></div>
            <div class="face"></div><div class="face"></div>
          </div></div>
          <div class="halo"></div>
        </div>
        <h1 class="hero-title">Pyramid</h1>
        <div class="hero-tag" id="homeTag"></div>
        <p class="hero-lead" id="homeLead"></p>
        <button class="cta" id="goRooms"></button>
      </div>
      <div class="scroll-cue">⌄</div>
    </section>

    <div class="wrap-in">
      <section class="reveal slab">
        <div class="slab-head">
          <span class="slab-date" id="tDate"></span>
          <span class="slab-clock" id="tClock">—:—</span>
        </div>
        <div class="slab-meta" id="tMeta"></div>
        <hr class="vein-rule">
        <div class="slab-label" id="tHolTitle"></div>
        <div class="hol" id="tHol"></div>
      </section>

      <section class="reveal">
        <div class="slab-label" id="tQuotesTitle" style="margin-bottom:12px"></div>
        <div id="tQuotes"></div>
      </section>

      <section class="reveal">
        <div class="perks" id="perks"></div>
      </section>

      <section class="reveal center">
        <button class="cta wide" id="goRooms2"></button>
      </section>
    </div>
  </div>

  <!-- ВЫБОР КОМНАТЫ -->
  <div class="view" id="viewRooms">
    <h2 style="font-family:var(--serif);font-size:clamp(24px,5vw,34px);margin:18px 0 6px" id="roomsTitle"></h2>
    <p class="today-meta" id="roomsHint" style="margin-bottom:16px"></p>
    <div class="portals">
      <button class="portal" data-style="green"><span class="bg" id="bgPyr" style="background:radial-gradient(120% 80% at 50% 12%,rgba(246,231,184,.45),transparent 58%),linear-gradient(180deg,#17805C,#0A3A28 55%,#04170F)"></span><span class="plate"><h3 id="rnPyr"></h3><p id="rdPyr"></p></span></button>
      <button class="portal" data-style="gold"><span class="bg" id="bgGld" style="background:radial-gradient(70% 55% at 32% 26%,#FBE9B4,transparent 62%),radial-gradient(90% 70% at 75% 78%,#C9992F,transparent 66%),linear-gradient(180deg,#D9A63A,#4A340A)"></span><span class="plate"><h3 id="rnGld"></h3><p id="rdGld"></p></span></button>
      <button class="portal" data-style="silver"><span class="bg" id="bgSlv" style="background:radial-gradient(120% 80% at 50% 12%,rgba(232,242,247,.5),transparent 58%),linear-gradient(180deg,#8B979D,#3A4246 52%,#0C0E0F)"></span><span class="plate"><h3 id="rnSlv"></h3><p id="rdSlv"></p></span></button>
    </div>
    <button class="chip" id="backHome" style="margin-top:16px"></button>
  </div>

  <!-- КОМНАТА -->
  <div class="view" id="viewRoom">
    <div class="room-bar">
      <span class="rb-room"><span class="dot" id="rbDot"></span><span id="rbRole"></span></span>
      <span class="rb-sep"></span>
      <button class="ib" id="hpSwitch" role="switch" aria-checked="false" title="">
        <span class="ib-ic" id="hpIc">🔈</span><span class="ib-tx" id="hpNow"></span>
      </button>
      <button class="ib" id="transfer" title=""><span class="ib-ic">⇄</span></button>
      <button class="ib" id="toRooms" title=""><span class="ib-ic">◆</span></button>
      <button class="ib" id="invite" title=""><span class="ib-ic">＋</span></button>
      <button class="ib" id="diagBtn" title="i"><span class="ib-ic">i</span></button>
    </div>
    <p class="rb-hint" id="hpHint"></p>

    <div class="console" id="console">
      <div class="cs-now"><b id="title"></b><span id="state">—</span></div>
      <input type="range" id="seek" min="0" max="100" value="0">
      <div class="cs-time"><span id="cur">0:00</span><span id="rem">0:00</span></div>

      <div class="cs-row">
        <button class="cb" id="back15" title="">−15</button>
        <button class="cb big" id="play" title="">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="cb big" id="pause" title="">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button class="cb" id="stop" title="">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button class="cb" id="fwd15" title="">+15</button>
      </div>

      <div class="cs-row two">
        <div class="drop" id="dropLib">
          <button class="db" id="libBtn"><span>◍</span><span id="libLbl"></span></button>
          <div class="menu" id="libMenu"></div>
        </div>
        <div class="drop" id="dropAdd">
          <button class="db" id="addBtn"><span>↥</span><span id="addLbl"></span></button>
          <div class="menu" id="addMenu">
            <button class="mi" id="miFile"></button>
            <button class="mi" id="miUrl"></button>
            <div class="mi-url" id="urlBox">
              <input id="urlInput" placeholder="https://…">
              <button id="urlGo">→</button>
            </div>
          </div>
        </div>
      </div>

      <input type="file" id="upload" style="display:none"
        accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.aif,.aiff,.caf,.flac,.ogg,.oga,.opus,.mp4,.wma,.alac">

      <div class="cs-chat" id="chatBox">
        <div id="chat"></div>
        <input id="chatInput">
      </div>

      <div class="cs-row vols">
        <button class="ib" id="micBtn" aria-pressed="true" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="17" height="17">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
            <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg></button>
        <div class="drop up" id="dropMusic">
          <button class="ib" id="musicBtn" title=""><span class="ib-ic">♪</span></button>
          <div class="menu slider" id="musicMenu">
            <label id="lblMusic"></label>
            <input type="range" id="music" min="0" max="100" value="60">
          </div>
        </div>
        <div class="drop up" id="dropVoice">
          <button class="ib" id="voiceBtn" title=""><span class="ib-ic">◉</span></button>
          <div class="menu slider" id="voiceMenu">
            <label id="lblVoice"></label>
            <input type="range" id="voice" min="0" max="100" value="85">
          </div>
        </div>
        <span id="duck"></span>
      </div>
    </div>

    <div class="diag-sheet" id="diagSheet">
      <h3 style="font-size:19px;margin-bottom:8px" id="diagTitle"></h3>
      <div id="diag"></div>
      <p class="hint" id="diagHint"></p>
    </div>
  </div>
</div>

<div class="sheet-back" id="inviteBack"><div class="sheet">
  <h3 id="inviteTitle"></h3>
  <p class="note" id="inviteNote"></p>
  <a class="opt" id="optSms"><span class="ic">✉</span><span></span></a>
  <a class="opt" id="optMail"><span class="ic">@</span><span></span></a>
  <a class="opt" id="optWa" target="_blank" rel="noopener"><span class="ic">◍</span><span></span></a>
  <button class="opt" id="optCopy"><span class="ic">⧉</span><span></span></button>
  <button class="opt close" id="optClose"></button>
</div></div>

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="i18n.js"></script>
<script src="day.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
