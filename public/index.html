<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pyramid</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#5FD7AE;--gold-100:#F6E7B8;--gold-300:#E3C878;--gold-500:#C0982F;--gold-700:#7E6115;
  --ink:#3A3222;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Golos Text",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#04170F;color:#E7F2EB;font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(80% 60% at 50% 0%,rgba(246,231,184,.10),transparent 60%),
  radial-gradient(100% 70% at 50% 100%,rgba(95,215,174,.08),transparent 60%),
  linear-gradient(180deg,#062A1C,#04170F 55%,#02100A)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-300);outline-offset:3px}

.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(3,14,9,.96);backdrop-filter:blur(10px);transition:opacity .5s}
.gate.gone{opacity:0;pointer-events:none}
.gate .card{width:min(420px,100%);text-align:center;background:none;border:none;padding:0;margin:0}
.gate h1{font-size:44px;letter-spacing:.06em}
.gate p{color:#9CBBAD;font-size:14.5px;margin:10px 0 22px}
.gate input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(224,200,120,.25);
  border-radius:2px;padding:12px 14px;margin-bottom:12px;text-align:center}
.enter{width:100%;padding:13px;border:none;border-radius:2px;font-weight:600;cursor:pointer;
  background:linear-gradient(140deg,var(--gold-300),var(--gold-500));color:#241A06}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top .spacer{margin-left:auto}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.06em}
.chip{border:1px solid rgba(255,255,255,.24);background:rgba(8,20,15,.5);color:#EAF4EE;
  padding:8px 13px;border-radius:99px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--gold-300)}
.sub{font-size:12.5px;color:#8FB5A5;margin-bottom:12px}
select.lang{background:rgba(8,20,15,.6);border:1px solid rgba(255,255,255,.24);color:#EAF4EE;
  border-radius:99px;padding:7px 10px;font-size:13.5px;cursor:pointer}

.switch{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.switch .track{width:56px;height:30px;border-radius:99px;position:relative;flex:none;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);transition:.2s}
.switch .knob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(160deg,#E9F6F0,#B7CFC5);transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.switch[aria-checked="true"] .track{background:linear-gradient(140deg,var(--jade),#1E8A67);border-color:transparent}
.switch[aria-checked="true"] .knob{left:28px;background:linear-gradient(160deg,#FFFDF5,#E3C878)}
.switch .labels{display:grid;line-height:1.2}
.switch .on{font-size:15px}
.switch .off{font-size:12px;color:#7FA294}
.mode-hint{font-size:12px;color:#7FA294;line-height:1.45;margin-top:10px}

.card{background:linear-gradient(180deg,rgba(9,40,28,.55),rgba(4,20,14,.75));
  border:1px solid rgba(224,200,120,.20);border-radius:6px;padding:16px;margin-bottom:14px}
.now{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.now b{font-weight:500;font-size:15px}
.now span{font-size:13px;color:#A9C4B8}
#seek{width:100%;accent-color:var(--gold-500);margin:10px 0 2px}
#seek:disabled{opacity:.4}
.time{display:flex;justify-content:space-between;font-size:12px;color:#A9C4B8}
.transport{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:14px}
.tbtn{height:46px;min-width:48px;padding:0 12px;border-radius:99px;border:1px solid rgba(246,231,184,.36);
  background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center;font-size:13px}
.tbtn:hover{border-color:var(--gold-300)}
.tbtn:disabled{opacity:.3;cursor:not-allowed}
.tbtn.main{width:54px;height:54px;min-width:54px;padding:0;border:none;color:#241A06;
  background:radial-gradient(circle at 36% 30%,var(--gold-100),var(--gold-300) 42%,var(--gold-500))}
.tbtn.main:disabled{background:rgba(255,255,255,.1);color:#9CBBAD}
.tbtn svg{display:block}

.rail{display:flex;gap:14px;overflow-x:auto;padding:6px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.item{flex:none;width:112px;scroll-snap-align:center;background:none;border:none;padding:0;cursor:pointer;
  display:grid;justify-items:center;gap:8px;color:#DCEAE1}
.art{width:104px;height:104px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.2) 1px 3.5px),
    radial-gradient(circle at 30% 24%,rgba(190,255,230,.2),transparent 44%),
    radial-gradient(circle,#0E3227 56%,#05170F 100%);
  border:1px solid rgba(220,255,240,.26);box-shadow:0 14px 28px -16px rgba(0,0,0,.95)}
.art::after{content:"";position:absolute;inset:35%;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,var(--gold-100),var(--gold-300) 40%,var(--gold-500) 74%,var(--gold-700))}
.cap{font-size:12px;line-height:1.3;color:#BCD5C8;min-height:32px}
.item[aria-current="true"] .art{box-shadow:0 0 0 2px var(--jade)}
.item[aria-current="true"] .cap{color:var(--gold-100)}
body.guest .item{opacity:.5}

.notebook{background:linear-gradient(178deg,#F4EBD4,#E2D5B6);color:var(--ink);border-radius:3px;padding:12px 14px}
.notebook h3{font-size:20px;margin-bottom:4px}
#chat{min-height:84px;max-height:280px;overflow-y:auto;
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(58,50,34,.16) 27px 28px)}
.msg{font-family:var(--serif);font-size:17px;line-height:28px}
.msg b{font-weight:600}
#chatInput{width:100%;margin-top:8px;background:rgba(58,50,34,.08);border:1px solid rgba(58,50,34,.28);
  border-radius:2px;padding:8px 10px;color:var(--ink)}

.bottom{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#mic{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#8CF0CC,var(--jade) 45%,#17795A);color:#04160F}
#mic[aria-pressed="false"]{background:rgba(255,255,255,.12);color:#CDE3D8}
.vol{display:grid;gap:2px;flex:1;min-width:120px}
.vol label{font-size:12px;color:#B7D0C4}
.vol input{width:100%;accent-color:var(--jade)}
#duck{font-size:12px;color:#241A06;background:var(--gold-300);border-radius:99px;padding:5px 10px;opacity:0;transition:.2s}
#duck.on{opacity:1}

#diag{font-size:12.5px;color:#8FB5A5;display:grid;gap:5px}
#diag div{display:flex;justify-content:space-between;gap:12px}
#diag b{color:#CFE3D8;font-weight:500;text-align:right}
.hint{font-size:12.5px;color:#7FA294;margin-top:10px;line-height:1.5}
.upload{display:inline-block;cursor:pointer;border:1px dashed rgba(246,231,184,.4);border-radius:2px;
  padding:9px 12px;font-size:13.5px;color:#EBDCB6;margin-top:10px}
#upload{display:none}

.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(2,8,6,.7);backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center}
.sheet-back.on{display:flex}
.sheet{width:min(520px,100%);background:linear-gradient(180deg,#0A3225,#052016);
  border-top:1px solid rgba(246,231,184,.3);border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out both}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:23px;margin-bottom:4px}
.sheet .note{font-size:12.5px;color:#7FA294;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:4px;text-align:left;
  color:#EAF4EE;text-decoration:none;font-size:15px}
.opt:hover{border-color:var(--gold-300)}
.opt .ic{width:26px;text-align:center;color:var(--gold-300);font-size:17px}
.opt.close{justify-content:center;background:none;border-style:dashed;color:#9CBBAD}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(14px);z-index:80;
  background:var(--gold-300);color:#241A06;padding:10px 18px;border-radius:99px;font-size:14px;
  opacity:0;transition:.24s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* холст комнаты живёт под интерфейсом */
#gl{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:0}
body.in-room #gl{display:block}
body.in-room{background:linear-gradient(180deg,#062A1C,#04170F 55%,#02100A)}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;display:none;
  background:radial-gradient(125% 95% at 50% 45%,transparent 42%,rgba(1,8,5,.45) 88%,rgba(1,6,4,.8) 100%)}
body.in-room .vignette{display:block}
body.in-room .wrap{position:relative;z-index:2}
body.in-room .card{background:linear-gradient(180deg,rgba(6,26,18,.55),rgba(3,14,10,.72));backdrop-filter:blur(12px)}
body.in-room .notebook{background:linear-gradient(178deg,rgba(244,235,212,.94),rgba(226,213,182,.94))}

/* вращающаяся пирамида-логотип */
.pyr-stage{perspective:900px;display:flex;justify-content:center;align-items:flex-end}
.pyr{--s:34px;position:relative;width:var(--s);height:calc(var(--s)*1.55);transform-style:preserve-3d;
  animation:pyrSpin 30s linear infinite}
.pyr .face{position:absolute;left:0;bottom:0;width:var(--s);height:calc(var(--s)*1.58);
  clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%;
  background:linear-gradient(168deg,#1B6E51,#0B3A29 38%,#17805C 62%,#062419);
  background-size:cover;background-position:center}
.pyr .face:nth-child(1){transform:rotateY(0deg) translateZ(calc(var(--s)/2)) rotateX(18deg)}
.pyr .face:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2)) rotateX(18deg);filter:brightness(.8)}
.pyr .face:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2)) rotateX(18deg);filter:brightness(.62)}
.pyr .face:nth-child(4){transform:rotateY(270deg) translateZ(calc(var(--s)/2)) rotateX(18deg);filter:brightness(.88)}
.pyr .face svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes pyrSpin{to{transform:rotateY(360deg)}}

/* главная страница */
.view{display:none}.view.on{display:block}

/* ================= ГЛАВНАЯ ================= */
body:not(.in-room) .wrap{max-width:none;padding:0}
body:not(.in-room) .top{position:fixed;top:0;left:0;right:0;z-index:30;margin:0;
  padding:10px 18px;background:linear-gradient(180deg,rgba(2,14,9,.86),rgba(2,14,9,0));
  backdrop-filter:blur(10px)}
.hero{position:relative;min-height:100svh;display:grid;place-items:center;
  overflow:hidden;text-align:center;padding:86px 20px 70px}
.hero-marble{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;
  animation:drift 54s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2.5%,-1.5%,0) scale(1.06)}to{transform:translate3d(2.5%,1.5%,0) scale(1.16)}}
.hero-veil{position:absolute;inset:0;
  background:radial-gradient(62% 50% at 50% 44%,rgba(2,14,9,.28),rgba(2,12,8,.90) 76%),
    linear-gradient(180deg,rgba(2,12,8,.74),transparent 26%,rgba(2,12,8,.5) 66%,#02100A)}
.hero-inner{position:relative;z-index:2;max-width:600px;
  animation:rise 1.1s cubic-bezier(.16,.8,.24,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero-logo{position:relative;display:grid;place-items:center;margin-bottom:22px;
  transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.hero-logo .pyr{--s:min(132px,30vw)}
.halo{position:absolute;width:150%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(246,231,184,.20),transparent 70%);
  animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.5}50%{transform:scale(1.12);opacity:1}}
.hero-title{font-size:clamp(46px,12vw,92px);letter-spacing:.1em;line-height:1;margin:0;
  background:linear-gradient(180deg,#FFFCF0,#F0DCA0 42%,#B98A28);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(224,200,120,.28))}
.hero-tag{font-family:var(--serif);font-size:clamp(19px,4.2vw,27px);color:#D5E8DE;margin-top:14px;font-style:italic}
.hero-lead{color:#93B3A6;font-size:15px;line-height:1.7;margin:18px auto 30px;max-width:430px}
.cta{display:inline-block;text-decoration:none;border:none;cursor:pointer;padding:15px 34px;
  border-radius:99px;font-weight:600;font-size:15px;font-family:inherit;color:#241A06;
  background:linear-gradient(140deg,#FFF6D8,var(--gold-300) 46%,var(--gold-500));
  box-shadow:0 16px 44px -14px rgba(224,200,120,.7);transition:transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 24px 54px -14px rgba(224,200,120,.9)}
.scroll-cue{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2}
.scroll-cue span{display:block;width:20px;height:32px;border:1.5px solid rgba(246,231,184,.4);
  border-radius:99px;position:relative}
.scroll-cue span::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:99px;
  background:rgba(246,231,184,.8);transform:translateX(-50%);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{0%{transform:translate(-50%,0);opacity:1}70%{transform:translate(-50%,11px);opacity:0}100%{opacity:0}}

.page{max-width:660px;margin:0 auto;padding:64px 20px 30px;display:grid;gap:58px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.reveal.seen{opacity:1;transform:none}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-500)}
.lead{color:#8FB5A5;font-size:14px;line-height:1.6;margin:10px 0 22px}
.slab{position:relative;padding:26px;border-radius:14px;overflow:hidden;
  background:linear-gradient(155deg,rgba(14,62,44,.42),rgba(4,22,15,.72));
  border:1px solid rgba(246,231,184,.18)}
.slab::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 16% 0%,rgba(246,231,184,.10),transparent 62%)}
.slab-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.slab-date,.slab-clock{font-family:var(--serif);font-size:clamp(23px,5.4vw,32px)}
.slab-clock{color:var(--gold-300)}
.slab-meta{font-size:13.5px;color:#8FB5A5;margin-top:5px}
.vein-rule{height:1px;border:0;margin:20px 0;
  background:linear-gradient(90deg,transparent,var(--gold-500),transparent);opacity:.5}
.hol{display:grid;gap:10px;font-size:14.5px;margin-top:12px}
.hol div{display:flex;gap:11px;align-items:baseline}
.hol .dot{color:var(--gold-500);font-size:9px}
.quote{border-left:2px solid var(--gold-500);padding:5px 0 5px 20px;margin-bottom:22px}
.quote q{font-family:var(--serif);font-style:italic;font-size:clamp(19px,3.8vw,25px);line-height:1.45;quotes:'«' '»'}
.quote cite{display:block;margin-top:9px;font-style:normal;font-size:12.5px;color:#8FB5A5}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.perk{font-size:13.5px;color:#9CBBAD;line-height:1.55;padding:18px;border-radius:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.07);transition:border-color .2s,transform .2s}
.perk:hover{border-color:rgba(246,231,184,.28);transform:translateY(-2px)}
.perk .ic{display:block;color:var(--gold-300);font-size:16px;margin-bottom:9px}
@media (max-width:560px){.perks{grid-template-columns:1fr}}
.foot{text-align:center;font-family:var(--serif);font-size:20px;letter-spacing:.14em;
  color:rgba(246,231,184,.35);padding:16px 0 40px}

.portals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.portal{position:relative;border:none;background:none;padding:0;cursor:pointer;color:inherit;
  width:100%;aspect-ratio:1/.95;transition:transform .25s}
.portal .bg{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);
  background-size:cover;background-position:center}
.portal .glowline{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(246,231,184,.30),transparent 42%);opacity:0;transition:opacity .25s}
.portal:hover{transform:translateY(-6px)}
.portal:hover .glowline{opacity:1}
.portal .plate{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 10px;
  background:linear-gradient(0deg,rgba(3,10,7,.92),transparent)}
.portal h3{font-size:16px}
.portal p{font-size:11px;color:#A9C4B8;margin-top:3px;line-height:1.35}
@media (max-width:640px){.portals{grid-template-columns:1fr;max-width:300px;margin:0 auto;gap:8px}}

/* ================= КОМНАТА ================= */
body.in-room .wrap{max-width:none;padding:0;height:100vh;height:100dvh;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px}
body.in-room .top{display:none}
body.in-room .card{background:none;border:none;padding:0;margin:0}

.room-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  padding:6px 8px;border-radius:16px;width:min(520px,calc(100vw - 20px));
  background:rgba(6,22,15,.55);border:1px solid rgba(246,231,184,.22);backdrop-filter:blur(14px);
  position:relative;z-index:6}
body.guest .room-bar{width:300px}
.rb-room{font-size:11.5px;color:#BCD5C8;display:flex;align-items:center;gap:6px;padding:0 3px;white-space:nowrap}
.rb-room .dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 7px var(--jade)}
.rb-room .dot.solo{background:#7d8f88;box-shadow:none}
body.guest .rb-room{display:none}
.ib{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:99px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#E7F2EB;font-size:11.5px}
.ib:hover{border-color:var(--gold-300)}
.ib svg{width:15px;height:15px;flex:none}
.ib.only{padding:0;width:30px;justify-content:center}
.ib.exit{border-color:rgba(255,170,150,.32);color:#F2CEC4}
.ib[hidden]{display:none}
body.guest .ib:not(.exit){display:none}

/* режим звука: две пиктограммы, видно какая выбрана */
.seg{display:inline-flex;padding:2px;border-radius:99px;background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.14);flex:none}
.seg button{width:34px;height:26px;display:grid;place-items:center;border:none;border-radius:99px;
  cursor:pointer;background:none;color:#9FBCB0}
.seg button svg{width:15px;height:15px}
.seg button.on{background:linear-gradient(140deg,var(--jade),#1E8A67);color:#05261B}

/* пульт */
.console{width:290px;position:relative;z-index:4;padding:12px;border-radius:14px;
  background:linear-gradient(180deg,rgba(8,30,21,.62),rgba(3,14,10,.78));
  border:1px solid rgba(246,231,184,.22);backdrop-filter:blur(16px);
  box-shadow:0 30px 70px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,246,216,.12)}
.cs-title{font-size:13px;font-weight:500;line-height:1.35;min-height:18px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cs-state{font-size:10.5px;color:#9CBBAD;margin-top:2px}
#seek{width:100%;accent-color:var(--gold-500);margin:7px 0 1px;height:14px}
#seek:disabled{opacity:.45}
.cs-time{display:flex;justify-content:space-between;font-size:10px;color:#8FB5A5}
.row{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:9px}
body.guest .master-only{display:none}
.cb{height:32px;min-width:32px;padding:0 8px;border-radius:99px;cursor:pointer;font-size:10.5px;
  border:1px solid rgba(246,231,184,.3);background:rgba(255,255,255,.05);color:#EFE6CE;display:grid;place-items:center}
.cb:hover{border-color:var(--gold-300)}
.cb:disabled{opacity:.3;cursor:not-allowed}
.cb svg{width:13px;height:13px}
.cb.big{width:38px;height:38px;min-width:38px;border:none;color:#241A06;
  background:radial-gradient(circle at 36% 30%,var(--gold-100),var(--gold-300) 42%,var(--gold-500))}
.cb.big:disabled{background:rgba(255,255,255,.08);color:#9CBBAD}

/* фонотека и добавление */
.drop{position:relative;flex:1}
.db{width:100%;height:31px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;
  cursor:pointer;font-size:11px;border:1px solid rgba(246,231,184,.26);
  background:rgba(255,255,255,.05);color:#EBDCB6}
.db:hover{border-color:var(--gold-300)}
.db span:first-child{color:var(--gold-300)}
.menu{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 6px);z-index:20;
  max-height:46vh;overflow:auto;padding:6px;border-radius:10px;
  background:rgba(5,20,14,.97);border:1px solid rgba(246,231,184,.28);backdrop-filter:blur(14px);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.95)}
.drop.open .menu{display:block}
.menu .gh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-500);padding:7px 8px 3px}
.mi{display:block;width:100%;text-align:left;padding:8px 10px;border:none;border-radius:6px;cursor:pointer;
  background:none;color:#DCEAE1;font-size:12px;line-height:1.3}
.mi:hover{background:rgba(255,255,255,.08)}
.mi[aria-current="true"]{color:var(--gold-100);background:rgba(224,200,120,.14)}
.mi.empty{color:#7FA294;cursor:default}
.mi-url{display:none;gap:6px;padding:6px}
.mi-url.on{display:flex}
.mi-url input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  border-radius:6px;padding:6px 8px;color:#E7F2EB;font-size:11.5px}
.mi-url button{border:none;border-radius:6px;padding:0 10px;cursor:pointer;background:var(--gold-300);color:#241A06}

/* три кнопки звука в одну строку, одного размера */
.row.tools{gap:6px;justify-content:space-between}
.micsw{flex:1;height:34px;padding:3px;border:none;border-radius:99px;cursor:pointer;
  background:none;display:flex;align-items:center}
.mtrack{width:100%;height:28px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,rgba(60,200,150,.30) 0 50%,rgba(230,90,70,.30) 50% 100%);
  border:1px solid rgba(255,255,255,.18)}
.mknob{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;transition:left .18s,background .18s,color .18s;
  background:#2FBF8E;color:#04241A;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mknob svg{width:14px;height:14px}
.micsw[aria-checked="false"] .mknob{left:calc(100% - 26px);background:#D9503F;color:#2A0906}
.vb{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:99px;
  cursor:pointer;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
  color:#DCEAE1;font-size:12px}
.vb:hover{border-color:var(--gold-300)}
.vb svg{width:15px;height:15px;color:var(--gold-300)}
.vb em{font-style:normal;color:#9CBBAD;min-width:20px;text-align:left}
.slide{display:none;margin-top:7px}
.slide.on{display:block}
.slide input{width:100%;accent-color:var(--jade)}

/* чат пузырями, под кнопками звука */
.chat{margin-top:10px;border-radius:10px;padding:8px;background:rgba(0,0,0,.24);
  border:1px solid rgba(255,255,255,.08);cursor:pointer}
.msgs{display:grid;gap:5px;max-height:72px;overflow:hidden;transition:max-height .25s}
.chat.open .msgs{max-height:170px;overflow-y:auto}
.bub{max-width:80%;padding:6px 10px;border-radius:14px;font-size:11.5px;line-height:1.35}
.bub.them{justify-self:start;border-bottom-left-radius:4px;background:rgba(255,255,255,.13);color:#EAF4EE}
.bub.me{justify-self:end;border-bottom-right-radius:4px;background:linear-gradient(140deg,#27795E,#1B5A45);color:#EAF7F1}
.bub.sys{justify-self:center;background:none;color:#8FB5A5;font-size:10.5px}
.send{display:flex;gap:6px;margin-top:7px}
.send input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:99px;padding:6px 12px;color:#E7F2EB;font-size:11.5px}
.send button{flex:none;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--gold-300),var(--gold-500));color:#241A06;display:grid;place-items:center}
.send button svg{width:13px;height:13px}
#duck{position:absolute;top:-11px;right:10px;font-size:10px;color:#241A06;background:var(--gold-300);
  border-radius:99px;padding:3px 9px;opacity:0;transition:.2s;white-space:nowrap}
#duck.on{opacity:1}

.diag-sheet{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:8;
  width:min(360px,calc(100vw - 24px));padding:13px;border-radius:12px;
  background:rgba(4,18,12,.95);border:1px solid rgba(246,231,184,.24);backdrop-filter:blur(14px)}
.diag-sheet.on{display:block}
#diag{font-size:11px;color:#8FB5A5;display:grid;gap:4px}
#diag div{display:flex;justify-content:space-between;gap:10px}
#diag b{color:#CFE3D8;font-weight:500;text-align:right}

/* верхняя строка живёт сверху экрана, а не приклеена к пульту */
.room-bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);
  width:auto;max-width:calc(100vw - 16px)}
body.guest .room-bar{width:auto}
.rb-role{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:#9FC0B0;white-space:nowrap;
  text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none}
.rb-role .dot{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 7px var(--jade)}
.rb-role .dot.solo{background:#7d8f88;box-shadow:none}
body.guest .rb-role{display:none}

/* чат всегда одной высоты: три-четыре строки, дальше прокрутка */
.chat{cursor:default}
.msgs{max-height:none;height:76px;overflow-y:auto;align-content:end;
  -webkit-overflow-scrolling:touch}
.chat.open .msgs{height:76px;max-height:none}
.send{align-items:center}
.send input{height:32px;line-height:32px;padding:0 12px;font-size:16px}
.send button{width:32px;height:32px;flex:none}

/* поля ввода 16 пунктов: иначе телефон сам приближает страницу и не возвращает */
.mi-url input,#chatInput,.gate input{font-size:16px}

/* ползунок громкости всплывает поверх кнопки */
.pop{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:150px;padding:10px 12px;border-radius:12px;z-index:22;
  background:rgba(5,20,14,.97);border:1px solid rgba(246,231,184,.3);
  box-shadow:0 18px 40px -18px rgba(0,0,0,.95)}
.pop.on{display:block}
.pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:rgba(246,231,184,.3)}
.pop input{width:100%;accent-color:var(--jade)}
.row.tools{position:relative}
.vb{position:relative}

/* переключатель микрофона */
.micsw{flex:1;height:34px;padding:0;border:none;border-radius:99px;cursor:pointer;background:none}
.mtrack{display:block;width:100%;height:34px;border-radius:99px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,rgba(47,191,142,.34),rgba(47,191,142,.12));
  border:1px solid rgba(47,191,142,.45);transition:background .25s,border-color .25s}
.micsw[aria-checked="false"] .mtrack{background:linear-gradient(90deg,rgba(217,80,63,.14),rgba(217,80,63,.4));
  border-color:rgba(217,80,63,.55)}
.mknob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;transition:left .22s cubic-bezier(.3,1.4,.5,1),background .22s,color .22s;
  background:linear-gradient(160deg,#6EE7B7,#209E74);color:#04241A;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.mknob svg{width:14px;height:14px}
.micsw[aria-checked="false"] .mknob{left:calc(100% - 29px);
  background:linear-gradient(160deg,#FF8A75,#C63A29);color:#2A0906}
.mlabel{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:10px;
  letter-spacing:.08em;font-weight:600;transition:opacity .2s}
.mlabel.live{right:11px;color:#9BE9C9;opacity:1}
.mlabel.mute{left:11px;color:#FFC2B6;opacity:0}
.micsw[aria-checked="false"] .mlabel.live{opacity:0}
.micsw[aria-checked="false"] .mlabel.mute{opacity:1}
.mpulse{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  border:2px solid rgba(110,231,183,.7);animation:mp 2s ease-out infinite;pointer-events:none}
.micsw[aria-checked="false"] .mpulse{display:none}
@keyframes mp{0%{transform:scale(1);opacity:.7}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<div class="gate" id="gate"><div class="card">
  <h1>Pyramid</h1>
  <p id="gateLead"></p>
  <input id="name" autocomplete="nickname">
  <button class="enter" id="enter"></button>
  <p id="gateMic" style="margin-top:16px"></p>
</div></div>

<div class="wrap">
  <div class="top">
    <div class="pyr-stage"><div class="pyr" id="logoSmall">
      <div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1.2" opacity=".9"><path d="M50 4 C44 34 58 56 46 100"/><path d="M50 4 C62 40 40 70 66 100"/></g></svg></div>
      <div class="face"><svg viewBox="0 0 100 103" preserveAspectRatio="none"><g fill="none" stroke="#F2DFA4" stroke-width="1" opacity=".8"><path d="M50 6 C40 44 62 64 40 100"/></g></svg></div>
      <div class="face"></div><div class="face"></div>
    </div></div>
    <span class="brand">Pyramid</span>
    <span class="spacer"></span>
    <select class="lang" id="lang" aria-label="Language"></select>
  </div>

  <!-- ГЛАВНАЯ -->
  <div class="view on" id="viewHome">
    <section class="hero">
      <canvas class="hero-marble" id="heroMarble"></canvas>
      <div class="hero-veil"></div>
      <div class="hero-inner">
        <div class="hero-logo" id="heroLogo">
          <div class="pyr-stage"><div class="pyr" id="logoBig">
            <div class="face"></div><div class="face"></div><div class="face"></div><div class="face"></div>
          </div></div>
          <div class="halo"></div>
        </div>
        <h1 class="hero-title">Pyramid</h1>
        <div class="hero-tag" id="homeTag"></div>
        <p class="hero-lead" id="homeLead"></p>
        <a class="cta" href="#rooms" id="goRooms"></a>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </section>

    <div class="page">
      <section class="reveal" id="rooms">
        <div class="eyebrow" id="roomsTitle"></div>
        <p class="lead" id="roomsHint"></p>
        <div class="portals">
          <button class="portal" data-style="green">
            <span class="bg" id="bgPyr"></span><span class="glowline"></span>
            <span class="plate"><h3 id="rnPyr"></h3><p id="rdPyr"></p></span>
          </button>
          <button class="portal" data-style="gold">
            <span class="bg" id="bgGld"></span><span class="glowline"></span>
            <span class="plate"><h3 id="rnGld"></h3><p id="rdGld"></p></span>
          </button>
          <button class="portal" data-style="silver">
            <span class="bg" id="bgSlv"></span><span class="glowline"></span>
            <span class="plate"><h3 id="rnSlv"></h3><p id="rdSlv"></p></span>
          </button>
        </div>
      </section>

      <section class="reveal">
        <div class="perks" id="perks"></div>
      </section>

      <section class="reveal slab">
        <div class="slab-head">
          <span class="slab-date" id="tDate"></span>
          <span class="slab-clock" id="tClock">—:—</span>
        </div>
        <div class="slab-meta" id="tMeta"></div>
        <hr class="vein-rule">
        <div class="eyebrow" id="tHolTitle"></div>
        <div class="hol" id="tHol"></div>
      </section>

      <section class="reveal">
        <div class="eyebrow" id="tQuotesTitle" style="margin-bottom:14px"></div>
        <div id="tQuotes"></div>
      </section>

      <footer class="foot">Pyramid</footer>
    </div>
  </div>

  <!-- КОМНАТА -->
  <div class="view" id="viewRoom">
    <div class="room-bar" id="roomBar">
      <div class="seg" id="hpSeg">
        <button id="hpSpk" class="on" data-mode="speaker" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5"/></svg></button>
        <button id="hpHp" data-mode="headphones" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4" height="7" rx="2" fill="currentColor" stroke="none"/><rect x="17.5" y="13" width="4" height="7" rx="2" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <button class="ib" id="invite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M18 8v6M15 11h6"/></svg><span id="invLbl"></span></button>
      <button class="ib" id="transfer" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg><span id="trfLbl"></span></button>
      <button class="ib only" id="toRooms" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 21 20H3z"/></svg></button>
      <button class="ib only" id="diagBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.2"/></svg></button>
      <button class="ib exit" id="exitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4"/><path d="M11 8l-4 4 4 4M7 12h9"/></svg><span id="exitLbl"></span></button>
    </div>

    <div class="rb-role"><span class="dot" id="rbDot"></span><span id="rbRole"></span></div>
    <div class="console" id="console">
      <div class="cs-title" id="title"></div>
      <div class="cs-state" id="state">—</div>
      <input type="range" id="seek" min="0" max="100" value="0">
      <div class="cs-time"><span id="cur">0:00</span><span id="rem">0:00</span></div>

      <div class="row master-only" id="rowTransport">
        <button class="cb" id="back15">−15</button>
        <button class="cb big" id="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="cb big" id="pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <button class="cb" id="stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button class="cb" id="fwd15">+15</button>
      </div>

      <div class="row master-only" id="rowLib">
        <div class="drop" id="dropLib">
          <button class="db" id="libBtn" data-drop="dropLib"><span>◍</span><span id="libLbl"></span></button>
          <div class="menu" id="libMenu"></div>
        </div>
        <div class="drop" id="dropAdd">
          <button class="db" id="addBtn" data-drop="dropAdd"><span>↥</span><span id="addLbl"></span></button>
          <div class="menu" id="addMenu">
            <button class="mi" id="miFile"></button>
            <button class="mi" id="miUrl"></button>
            <div class="mi-url" id="urlBox"><input id="urlInput" placeholder="https://…"><button id="urlGo">→</button></div>
          </div>
        </div>
      </div>
      <input type="file" id="upload" style="display:none"
        accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav,.aif,.aiff,.caf,.flac,.ogg,.oga,.opus,.mp4,.wma,.alac">

      <div class="row tools" id="rowTools">
        <button class="micsw" id="micBtn" role="switch" aria-checked="true" title="">
          <span class="mtrack"><span class="mlabel live">LIVE</span><span class="mlabel mute">MUTE</span>
          <span class="mpulse"></span><span class="mknob"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg></span></span>
        </button>
        <div class="pop" id="musicSlide"><input type="range" id="music" min="0" max="100" value="60"></div>
        <button class="vb" id="musicBtn" title=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18.5a2.5 2.5 0 1 1-2-2.45V6l10-2v9.5a2.5 2.5 0 1 1-2-2.45V6.6l-6 1.2v10.7z"/></svg><em id="musicVal">60</em></button>
        <div class="pop" id="voiceSlide"><input type="range" id="voice" min="0" max="100" value="85"></div>
        <button class="vb" id="voiceBtn" title=""><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><em id="voiceVal">85</em></button>
      </div>


      <div class="chat" id="chatBox">
        <div class="msgs" id="chat"></div>
        <div class="send">
          <input id="chatInput" enterkeyhint="send">
          <button id="chatSend" aria-label="send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg></button>
        </div>
      </div>
      <span id="duck"></span>
    </div>

    <div class="diag-sheet" id="diagSheet">
      <h3 style="font-size:18px;margin-bottom:8px" id="diagTitle"></h3>
      <div id="diag"></div>
      <p class="hint" id="diagHint"></p>
    </div>
  </div>
</div>

<div class="sheet-back" id="inviteBack"><div class="sheet">
  <h3 id="inviteTitle"></h3>
  <p class="note" id="inviteNote"></p>
  <a class="opt" id="optSms"><span class="ic">✉</span><span></span></a>
  <a class="opt" id="optMail"><span class="ic">@</span><span></span></a>
  <a class="opt" id="optWa" target="_blank" rel="noopener"><span class="ic">◍</span><span></span></a>
  <button class="opt" id="optCopy"><span class="ic">⧉</span><span></span></button>
  <button class="opt close" id="optClose"></button>
</div></div>

<template id="icSpk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></template>
<template id="icHp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4.5" height="7" rx="2" fill="currentColor" stroke="none"/><rect x="17" y="13" width="4.5" height="7" rx="2" fill="currentColor" stroke="none"/></svg></template>

<template id="icMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg></template>
<template id="icMicOff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" stroke="none"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/><path d="M3.5 3.5l17 17" stroke-width="2.3"/></svg></template>

<audio id="remoteAudio" autoplay playsinline></audio>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="i18n.js"></script>
<script src="day.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
